---
- name: Configure MySQL 8.0 YUM repository
  hosts: database
  become: true

  tasks:
    - name: Add MySQL 8.0 repository
      ansible.builtin.yum_repository:
        name: mysql80-community
        description: MySQL 8.0 Community Server
        baseurl: https://repo.mysql.com/yum/mysql-8.0-community/el/{{ ansible_distribution_major_version }}/{{ ansible_architecture }}/
        gpgcheck: true
        gpgkey: https://repo.mysql.com/RPM-GPG-KEY-mysql-2023
        enabled: true
        state: present
