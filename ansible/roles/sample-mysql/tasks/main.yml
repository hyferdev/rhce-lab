---
- name: Install lvm2
  ansible.builtin.dnf:
    name: lvm2
    state: present

- name: Create 800MB partition on /dev/nvme1n1
  community.general.parted:
    device: /dev/nvme1n1
    number: 1
    state: present
    part_end: 800MiB

- name: Create volume group vg_database
  community.general.lvg:
    vg: vg_database
    pvs: /dev/nvme1n1p1
    state: present

- name: Create logical volume lv_mysql
  community.general.lvol:
    vg: vg_database
    lv: lv_mysql
    size: 512m
    state: present

- name: Format lv_mysql with XFS
  community.general.filesystem:
    fstype: xfs
    dev: /dev/vg_database/lv_mysql

- name: Create mount point /mnt/mysql_backups
  ansible.builtin.file:
    path: /mnt/mysql_backups
    state: directory
    mode: '0755'

- name: Mount lv_mysql persistently at /mnt/mysql_backups
  ansible.posix.mount:
    path: /mnt/mysql_backups
    src: /dev/vg_database/lv_mysql
    fstype: xfs
    opts: defaults
    state: mounted
