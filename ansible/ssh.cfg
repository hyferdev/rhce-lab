#ansible/ssh.cfg

Host ansible-control
    HostName 34.207.97.33 # Update with public IP of the control node
    User hyfer
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null

#Matches all internal lab nodes
Host *.hyfertechsolutions.com
    ProxyJump ansible-control
    User hyfer
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
