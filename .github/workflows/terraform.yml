# .github/workflows/terraform.yml

name: "Terraform Infrastructure"

on:
  push:
    branches:
      - main
      - 'user/**' # Trigger on user branches
    paths:
      - 'terraform/**'
  pull_request:
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action'
        required: true
        default: 'apply'
        type: choice
        options:
        - apply
        - destroy

jobs:
  # ============================================================================
  # JOB 1: PLAN
  # ============================================================================
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    
    # Selects Environment based on branch
    # This automatically loads the correct TF_API_TOKEN for that user.
    environment: ${{ (github.ref == 'refs/heads/main' && 'production-plan') || format('{0}-plan', github.ref_name) }}
    
    defaults:
      run:
        working-directory: ./terraform
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure Dynamic Backend & Auth
        shell: bash
        # Load the secret from the current Environment
        env:
          ENV_SPECIFIC_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          
          # Map Branch to TFC Organization & Workspace
          # Note: We do NOT need to select the token here; ENV_SPECIFIC_TOKEN is already correct.
          case "$BRANCH" in
            "main")         TF_ORG="Hyfer-Org";                    WORKSPACE="rhce-lab" ;;
            "user/natasha") TF_ORG="Hashiblack";                   WORKSPACE="rhce-lab" ;;
            "user/fre")     TF_ORG="frezdbanjhi";                  WORKSPACE="rhce-lab" ;;
            "user/leslie")  TF_ORG="TechieWealth";                 WORKSPACE="rhce-lab" ;;
            "user/derek")   TF_ORG="dowusubekoe-dev";              WORKSPACE="rhce-lab" ;;
            "user/sim"      TF_ORG="mathenjwas02-terraform-org";   WORKSPACE="rhce-lab" ;;
            "user/pat")     SKIP_TFC="true" ;;
            *)
              echo "Error: Branch '$BRANCH' is not mapped to a TFC Workspace. Execution stopped."
              exit 1
              ;;
          esac
          
          if [ "$SKIP_TFC" != "true" ]; then
            # Export the environment-specific token for Terraform to use
            echo "TF_TOKEN_app_terraform_io=$ENV_SPECIFIC_TOKEN" >> $GITHUB_ENV
            
            {
              echo "terraform {"
              echo "  cloud {"
              echo "    organization = \"$TF_ORG\""
              echo "    workspaces { name = \"$WORKSPACE\" }"
              echo "  }"
              echo "}"
            } > backend.tf
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check

      - name: Terraform Init
        id: init
        run: terraform init
      
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action != 'destroy') || github.event_name == 'push'
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Terraform Plan (Destroy)
        id: plan-destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform plan -destroy -no-color -input=false
        continue-on-error: true

      - name: Update Pull Request
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan 📖\`${{ steps.plan.outcome }}\`
            <details><summary>Show Plan</summary>
            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`
            </details>
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Check Plan Status
        if: steps.plan.outcome == 'failure' || steps.plan-destroy.outcome == 'failure'
        run: exit 1

  # ============================================================================
  # JOB 2: APPLY
  # ============================================================================
  terraform-apply:
    name: "Terraform Apply"
    needs: terraform-plan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    # Enforces Approval if configured in the Environment Settings
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || github.ref_name }}
    
    defaults:
      run:
        working-directory: ./terraform
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure Dynamic Backend & Auth
        shell: bash
        env:
          ENV_SPECIFIC_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          
          case "$BRANCH" in
            "main")         TF_ORG="Hyfer-Org";                    WORKSPACE="rhce-lab" ;;
            "user/natasha") TF_ORG="Hashiblack";                   WORKSPACE="rhce-lab" ;;
            "user/fre")     TF_ORG="frezdbanjhi";                  WORKSPACE="rhce-lab" ;;
            "user/leslie")  TF_ORG="TechieWealth";                 WORKSPACE="rhce-lab" ;;
            "user/derek")   TF_ORG="dowusubekoe-dev";              WORKSPACE="rhce-lab" ;;
            "user/sim")     TF_ORG="mathenjwas02-terraform-org";   WORKSPACE="rhce-lab" ;;
            "user/pat")     SKIP_TFC="true" ;;
            *)
              echo "Error: Branch '$BRANCH' is not mapped to a TFC Workspace. Execution stopped."
              exit 1
              ;;
          esac
          
          if [ "$SKIP_TFC" != "true" ]; then
            echo "TF_TOKEN_app_terraform_io=$ENV_SPECIFIC_TOKEN" >> $GITHUB_ENV
            {
              echo "terraform {"
              echo "  cloud {"
              echo "    organization = \"$TF_ORG\""
              echo "    workspaces { name = \"$WORKSPACE\" }"
              echo "  }"
              echo "}"
            } > backend.tf
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Apply
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (startsWith(github.ref, 'refs/heads/user/') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform apply -auto-approve -input=false

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false