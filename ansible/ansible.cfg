[defaults]
# Use local inventory and default to ubuntu user
inventory      = ./inventory
remote_user    = hyfer
# Disable host key checking for dynamic/new AWS instances
host_key_checking = False
# Better output for debugging failures
stdout_callback = debug
# Automatically use the right python on the EC2 instance
interpreter_python = auto_silent
# Number of parallel tasks
forks = 10

[ssh_connection]
# Standard SSH args for AWS (removes -F ./ssh.cfg for direct connection)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
# Fixes "mux_client_hello_exchange" or long path errors on macOS/Linux
control_path = %(directory)s/ansible-ssh-%%h-%%p-%%r
# Use SCP if SFTP is restricted on the AMI
scp_if_ssh = True
# Retry on transient connection failures (code 255)
retries = 3

