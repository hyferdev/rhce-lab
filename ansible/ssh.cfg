#ansible/ssh.cfg

Host ansible-control
    HostName 18.116.10.67 # Update with public IP of the control node
    User hyfer
    IdentityFile ~/.ssh/id_ed25519
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null

#Matches all internal lab nodes
Host *.hyfertechsolutions.com
    ProxyJump ansible-control
    User hyfer
    IdentityFile ~/.ssh/id_ed25519
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
    