#ansible/ssh.cfg

Host ansible-control
    HostName 3.86.10.48 # Update with public IP of the control node
    User hyfer
    IdentityFile ~/.ssh/id_rsa
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null

#Matches all internal lab nodes
Host *.hyfertechsolutions.com
    ProxyJump ansible-control
    User hyfer
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
    